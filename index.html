$('module').innerHTML='<option value="0">Tất cả mô-đun</option>'+names.slice(1).map((n,i)=>`<option value="${i+1}">${i+1}. ${n}</option>`).join('');
function shuffle(a){a=[...a];for(let i=a.length-1;i>0;i--){let j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function filter(){let m=+$('module').value,s=$('search').value.toLocaleLowerCase('vi');items=bank.filter(q=>(!m||q.m===m)&&[q.q,...q.a].join(' ').toLocaleLowerCase('vi').includes(s));page=0;render()}
function leave(){return mode!=='exam'||finished||!Object.keys(answers).length||confirm('Bạn có muốn bỏ bài thi đang làm?')}
$('study').onclick=()=>{if(!leave())return;mode='study';answers=studyAnswers;finished=false;filter();};$('exam').onclick=()=>{if(!leave())return;mode='exam';answers={};finished=false;items=shuffle(names.slice(1).flatMap((_,i)=>shuffle(bank.filter(q=>q.m===i+1)).slice(0,5)));page=0;render();window.scrollTo(0,0)};$('module').onchange=filter;$('search').oninput=filter;
function stats(){let done=items.filter(q=>answers[q.id]!==undefined).length,correct=items.filter(q=>answers[q.id]===q.k).length;let total=items.length;$('stats').innerHTML=[[mode==='exam'?'Câu trong đề':'Ngân hàng đã lọc',total],['Đã trả lời',done],['Chưa trả lời',total-done],[(mode==='study'||finished)?'Trả lời đúng':'Thang điểm',(mode==='study'||finished)?correct:10]].map(([a,b])=>`<div class="stat">${a}<b>${b}</b></div>`).join('');$('side').innerHTML=`<strong>${mode==='exam'?'Tiến độ bài thi':'Tiến độ ôn tập'}</strong><p>${done}/${total} câu</p><div class="bar"><div style="width:${total?done/total*100:0}%"></div></div>`+(mode==='exam'?`<div class="nav">${items.map((q,i)=>`<button class="${answers[q.id]!==undefined?'done':''} ${finished?(answers[q.id]===q.k?'right':'fail'):''}" onclick="document.getElementById('q${q.id}').scrollIntoView({behavior:'smooth'})">${i+1}</button>`).join('')}</div><button class="primary" style="width:100%" onclick="submitExam()" ${finished?'disabled':''}>Nộp bài</button>`:'<p>Chọn đáp án để xem kết quả ngay. Có thể thay đổi lựa chọn.</p><button onclick="resetStudy()">Xóa kết quả ôn tập</button>');if(finished&&mode==='exam')$('result').innerHTML=`<div class="panel"><h2>Kết quả: ${(correct*10/30).toFixed(2)} / 10 điểm</h2><p>Đúng: ${correct} · Sai: ${done-correct} · Bỏ trống: ${30-done}</p><p>Đáp án đúng được tô xanh. Đáp án chọn sai được tô đỏ.</p><button class="primary" onclick="document.getElementById('exam').click()">Thi lại đề mới</button></div>`;else $('result').innerHTML=''}
function render(){let exam=mode==='exam';$('module').classList.toggle('hidden',exam);$('search').classList.toggle('hidden',exam);$('study').classList.toggle('active',!exam);let shown=exam?items:items.slice(page*size,(page+1)*size);$('questions').innerHTML=shown.map((q,i)=>{let chosen=answers[q.id],reveal=finished||(mode==='study'&&chosen!==undefined);return `<article class="question" id="q${q.id}"><div class="tag">Mô-đun ${q.m} · ${esc(names[q.m])} · Câu gốc ${q.n}</div><h3>Câu ${exam?i+1:page*size+i+1}. ${esc(q.q)}</h3>${q.a.map((a,j)=>`<label class="opt ${reveal&&j===q.k?'correct':reveal&&j===chosen?'wrong':j===chosen?'selected':''}"><input type="radio" name="q${q.id}" ${j===chosen?'checked':''} ${finished?'disabled':''} onchange="pick(${q.id},${j})"><span><b>${'ABCD'[j]}.</b> ${esc(a)}</span></label>`).join('')}${reveal?`<div class="feedback">${chosen===q.k?'✓ Chính xác':chosen===undefined?'Chưa trả lời':'✗ Chưa chính xác'} · Đáp án: ${'ABCD'[q.k]}</div>`:''}</article>`}).join('')||'<div class="panel">Không tìm thấy câu hỏi.</div>';let count=Math.ceil(items.length/size);$('pages').innerHTML=!exam&&count>1?`<button onclick="turn(-1)" ${page===0?'disabled':''}>Trang trước</button><span>${page+1} / ${count}</span><button onclick="turn(1)" ${page+1===count?'disabled':''}>Trang sau</button>`:'';stats()}
function pick(id,j){if(finished)return;answers[id]=j;let y=window.scrollY;render();window.scrollTo(0,y)}function turn(d){page+=d;render();window.scrollTo(0,0)}function resetStudy(){if(confirm('Xóa toàn bộ kết quả ôn tập?')){studyAnswers={};answers=studyAnswers;render()}}function submitExam(){if(finished)return;let missing=items.filter(q=>answers[q.id]===undefined).length;if(!confirm(missing?`Còn ${missing} câu chưa trả lời. Bạn vẫn muốn nộp bài?`:'Xác nhận nộp bài thi?'))return;finished=true;render();$('result').scrollIntoView({behavior:'smooth'})}answers=studyAnswers;filter();</script></body></html>
